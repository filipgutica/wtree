name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            const conventional = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^\r\n()]+\))?!?: \S[^\r\n]*$/;
            if (!conventional.test(title)) {
              core.setFailed('Use a Conventional Commit title, such as fix: correct cleanup or feat!: change output.');
            }
